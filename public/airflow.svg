<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320"><rect width="800" height="320" fill="#edf3e5"/><g font-family="Arial,sans-serif" fill="#34543c"><text x="35" y="34" font-size="10" letter-spacing="2">VENTILATION · KEEP THE UNITS CONNECTED</text><path d="m60 160 110-60 125 67-111 64Z" fill="#cfdfbd" stroke="#92ac7b"/><path d="m60 160 124 71v51L60 211Z" fill="#adc69b" stroke="#92ac7b"/><path d="m184 231 111-64v50l-111 65Z" fill="#8cae7e" stroke="#789b68"/><path d="M101 144v-27m-5 6 5-6 5 6m48 9V98m-5 6 5-6 5 6m48 39v-26m-5 6 5-6 5 6" fill="none" stroke="#528378" stroke-width="3"/><text x="365" y="103" font-size="27">CFM = Volume × ACH ÷ 60</text><text x="365" y="139" font-size="13" fill="#6e8263">Volume in cubic feet · ACH in air changes per hour</text><path d="M365 161h381" stroke="#c7d8b6"/><text x="365" y="198" font-size="19">60,000 ft³ × 6 ÷ 60 = 6,000 CFM</text><text x="365" y="230" font-size="12" fill="#6e8263">This is ventilation flow—not a cooling load calculation.</text><text x="365" y="253" font-size="12" fill="#6e8263">Account for actual system losses when selecting equipment.</text></g></svg>
